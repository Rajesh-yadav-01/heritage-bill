<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <title>HERITAGE TITLE</title>
  <style>
    body { font-family: "Noto Sans Telugu", sans-serif; background: #f9f9f9; padding: 20px; }
    .container { max-width: 500px; margin: auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
    h2 { text-align: center; }
    table { width: 100%; margin-bottom: 15px; border-collapse: collapse; }
    th, td { padding: 6px; text-align: center; border: 1px solid #ddd; }
    button { margin: 5px; padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; }
    .btn { background: #007bff; color: white; }
    .btn:hover { background: #0056b3; }
    .reset { background: #dc3545; color: white; }
    .reset:hover { background: #a71d2a; }
    .copy { background: #28a745; color: white; }
    .copy:hover { background: #1e7e34; }
    pre { background: #f1f1f1; padding: 10px; border-radius: 5px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="container">
    <h2>HERITAGE BILL</h2>
    <table>
      <tr><th>వస్తువు</th><th>ధర (₹)</th><th>ఎన్ని</th></tr>
      <tr><td>పాలు 500ml</td><td>37</td><td><input type="number" min="0" id="milk500"></td></tr>
      <tr><td>పాలు 120ml</td><td>9</td><td><input type="number" min="0" id="milk120"></td></tr>
      <tr><td>పెరుగు 500ml (38)</td><td>38</td><td><input type="number" min="0" id="curd500b"></td></tr>
      <tr><td>పెరుగు 120ml</td><td>9</td><td><input type="number" min="0" id="curd120"></td></tr>
      <tr><td>మజ్జిగ ప్యాకెట్</td><td>8</td><td><input type="number" min="0" id="butterPkt"></td></tr>
      <tr><td>లస్సీ ప్యాకెట్</td><td>9</td><td><input type="number" min="0" id="lassiPkt"></td></tr>
      <tr><td>మజ్జిగ బ్యాగ్</td><td>225</td><td><input type="number" min="0" id="butterBag"></td></tr>
      <tr><td>లస్సీ బ్యాగ్</td><td>270</td><td><input type="number" min="0" id="lassiBag"></td></tr>
    </table>

    <button type="button" class="btn" onclick="generateBill()">🧾 బిల్ తయారు చేయి</button>
    <button type="button" class="reset" onclick="resetBill()">🔄 రీసెట్</button>
    <button type="button" class="copy" onclick="copyBill()">📋 కాపీ</button>

    <h3>బిల్ వివరాలు:</h3>
    <pre id="billText"></pre>
  </div>

  <script>
    function getValue(id) {
      let val = document.getElementById(id).value;
      return val === "" ? 0 : parseInt(val);
    }

    function generateBill() {
      const items = [
        {name: "పాలు 500ml", price: 37w, qty: getValue("milk500")},
        {name: "పాలు 120ml", price: 9, qty: getValue("milk120")},
        {name: "పెరుగు 500ml (36)", price: 38, qty: getValue("curd500b")},
        {name: "పెరుగు 120ml", price: 9, qty: getValue("curd120")},
        {name: "మజ్జిగ ప్యాకెట్", price: 8, qty: getValue("butterPkt")},
        {name: "లస్సీ ప్యాకెట్", price: 9, qty: getValue("lassiPkt")},
        {name: "మజ్జిగ బ్యాగ్", price: 225, qty: getValue("butterBag")},
        {name: "లస్సీ బ్యాగ్", price: 270, qty: getValue("lassiBag")}
      ];

      let output = "------- 🧾 బిల్ -------\n";
      let total = 0;

      items.forEach(item => {
        if(item.qty > 0){
          let lineTotal = item.qty * item.price;
          output += `${item.name} x ${item.qty} = ₹${lineTotal}\n`;
          total += lineTotal;
        }
      });

      output += "--------------------------\n";
      output += `మొత్తం: ₹${total}\n`;
      document.getElementById("billText").textContent = output;
    }

    function resetBill() {
      document.querySelectorAll("input").forEach(i => i.value = "");
      document.getElementById("billText").textContent = "";
    }

    function copyBill() {
      const billText = document.getElementById("billText").textContent;
      if (billText.trim() === "") {
        alert("బిల్ లేదు కాపీ చేయడానికి!");
        return;
      }
      navigator.clipboard.writeText(billText).then(() => {
        alert("బిల్ కాపీ అయింది!");
      }).catch(() => {
        alert("కాపీ విఫలమైంది, మాన్యువల్‌గా కాపీ చేయండి.");
      });
    }
  </script>
</body>
</html>
